<div class="flex flex-col h-[calc(100vh-11rem)] w-full max-w-4xl mx-auto p-4">
  <div class="flex-grow overflow-y-auto bg-base-200 rounded-lg p-4 space-y-4 shadow-inner">
    @for (message of agentService.messages(); track $index) {
      <div
        class="chat"
        [ngClass]="{
          'chat-start': message.role === 'assistant',
          'chat-end': message.role === 'user',
        }"
      >
        <div class="chat-image avatar">
          <div class="w-10 rounded-full border shadow-sm">
            <img [src]="message.role === 'assistant' ? '/ai.png' : '/user.png'" />
          </div>
        </div>

        <div class="chat-header opacity-50 text-xs mb-1">
          {{ message.role === 'assistant' ? 'AI Wingman' : 'You' }}
        </div>

        <div
          class="chat-bubble shadow-md"
          [ngClass]="{
            'chat-bubble-primary': message.role === 'user',
            'chat-bubble-secondary': message.role === 'assistant',
          }"
        >
          {{ message.content }}
        </div>
      </div>
    }

    @if (agentService.isLoading()) {
      <div class="chat chat-start">
        <div class="chat-image avatar">
          <div class="w-10 rounded-full border border-primary/20">
            <img src="/ai.png" alt="AI" />
          </div>
        </div>
        <div class="chat-bubble chat-bubble-secondary flex items-center gap-2 italic opacity-80">
          <span>AI Wingman is thinking</span>
          <span class="loading loading-dots loading-xs"></span>
        </div>
      </div>
    }
  </div>

  <div class="mt-4">
    <form (ngSubmit)="sendMessage()" class="flex items-center gap-2">
      <input
        type="text"
        name="prompt"
        [(ngModel)]="prompt"
        placeholder="Chat with your AI Wingman..."
        class="input input-bordered w-full focus:input-primary transition-all"
        (keyup.enter)="sendMessage()"
      />
      <button
        type="submit"
        class="btn btn-primary px-8"
        [disabled]="agentService.isLoading() || !prompt.trim()"
      >
        Send
      </button>
    </form>
  </div>
</div>
